
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Galaxy Live Wallpaper</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030d;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}
</style>
</head>

<body>
<canvas id="space"></canvas>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

let w, h, dpr;
let stars = [];
let dust = [];
let shootingStars = [];
let angle = 0;
let lastTime = 0;
let elapsed = 0;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = [];
    dust = [];

    for (let i = 0; i < 260; i++) {
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.5 + 0.2,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 2 + 0.5
        });
    }

    for (let i = 0; i < 100; i++) {
        dust.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 2 + 0.5,
            speed: Math.random() * 12 + 4,
            phase: Math.random() * 6.28
        });
    }
}

function background(t) {
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#02030d");
    g.addColorStop(0.45, "#101039");
    g.addColorStop(0.75, "#170d35");
    g.addColorStop(1, "#02030d");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // Glowing nebula clouds
    const clouds = [
        [w * 0.25, h * 0.45, "#2923a0", 0.18],
        [w * 0.68, h * 0.50, "#8b1c91", 0.16],
        [w * 0.52, h * 0.70, "#174e9b", 0.17],
        [w * 0.80, h * 0.24, "#421b79", 0.13]
    ];

    for (const [x, y, color, alpha] of clouds) {
        const ox = Math.sin(t * 0.12 + x) * w * 0.025;
        const oy = Math.cos(t * 0.10 + y) * h * 0.025;
        const radius = Math.max(w, h) * 0.32;

        const glow = ctx.createRadialGradient(
            x + ox, y + oy, 0,
            x + ox, y + oy, radius
        );

        glow.addColorStop(0, color);
        glow.addColorStop(1, "transparent");

        ctx.globalAlpha = 1;
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);
    }
}

function galaxy(t) {
    const cx = w * 0.51;
    const cy = h * 0.48;
    const radius = Math.min(w * 0.31, h * 0.39);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.035);

    // Soft galactic core
    const core = ctx.createRadialGradient(
        0, 0, 0, 0, 0, radius * 0.85
    );

    core.addColorStop(0, "rgba(255,240,255,0.95)");
    core.addColorStop(0.08, "rgba(160,145,255,0.65)");
    core.addColorStop(0.35, "rgba(91,60,205,0.20)");
    core.addColorStop(1, "rgba(40,20,120,0)");

    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.85, 0, Math.PI * 2);
    ctx.fill();

    // Spiral arms made of luminous particles
    for (let arm = 0; arm < 4; arm++) {
        for (let i = 0; i < 480; i++) {
            const p = i / 480;
            const r = 5 + p * radius;
            const a = p * 9.5 + arm * Math.PI / 2;
            const spread = 0.10 + p * 0.23;
            const theta = a + (Math.random() - 0.5) * spread;

            const x = Math.cos(theta) * r;
            const y = Math.sin(theta) * r * 0.70;

            const fade = (1 - p) * 0.8;
            const size = Math.random() * 1.5 + 0.25;

            ctx.globalAlpha = fade;
            ctx.fillStyle = i % 4 === 0
                ? "#f5d9ff"
                : i % 3 === 0
                ? "#71baff"
                : "#b8a4ff";

            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    ctx.restore();
    ctx.globalAlpha = 1;
}

function drawStars(t, dt) {
    for (const s of stars) {
        const brightness =
            0.35 + 0.65 * (0.5 + 0.5 *
            Math.sin(t * s.speed + s.phase));

        ctx.globalAlpha = brightness;
        ctx.fillStyle = "#ffffff";

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;

    for (const p of dust) {
        p.x -= p.speed * dt;
        p.y += Math.sin(t + p.phase) * 5 * dt;

        if (p.x < 0) p.x = w;
        if (p.y < 0) p.y = h;
        if (p.y > h) p.y = 0;

        ctx.fillStyle = "#9fcaff";
        ctx.globalAlpha = 0.3 + 0.5 *
            (0.5 + 0.5 * Math.sin(t + p.phase));

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

function spawnMeteor() {
    shootingStars.push({
        x: Math.random() * w * 0.9,
        y: Math.random() * h * 0.45,
        vx: 450 + Math.random() * 500,
        vy: 220 + Math.random() * 250,
        life: 0,
        duration: 0.6 + Math.random() * 0.7
    });
}

function drawMeteors(dt) {
    if (Math.random() < 0.018 && shootingStars.length < 3) {
        spawnMeteor();
    }

    for (let i = shootingStars.length - 1; i >= 0; i--) {
        const m = shootingStars[i];
        const oldX = m.x;
        const oldY = m.y;

        m.x += m.vx * dt;
        m.y += m.vy * dt;
        m.life += dt;

        const opacity = Math.max(0, 1 - m.life / m.duration);
        const tail = 100;

        const gradient = ctx.createLinearGradient(
            m.x, m.y,
            m.x - tail, m.y - tail * 0.48
        );

        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(0.25, "rgba(130,190,255,0.7)");
        gradient.addColorStop(1, "rgba(100,100,255,0)");

        ctx.globalAlpha = opacity;
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - tail, m.y - tail * 0.48);
        ctx.stroke();

        ctx.globalAlpha = 1;

        if (m.life >= m.duration || m.x > w || m.y > h) {
            shootingStars.splice(i, 1);
        }
    }
}

function animate(timestamp) {
    if (!lastTime) lastTime = timestamp;

    const dt = Math.min((timestamp - lastTime) / 1000, 0.04);
    lastTime = timestamp;
    elapsed += dt;
    angle += dt * 0.035;

    background(elapsed);
    drawStars(elapsed, dt);

    // Draw a smooth rotating galaxy.
    galaxy(angle);

    drawMeteors(dt);

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);
resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
